<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CheCAT Commerce">
  <!--
    Versión para tickets (impresora térmica) y para cualquier impresión a un
    solo color.
    Tres cosas cambian respecto del isotipo normal, y las tres por el mismo
    motivo: la térmica imprime sin grises, a baja resolución y con el logo a
    unos 2 cm de ancho.
      · Un solo color. El amarillo saldría como un gris sucio o directamente
        como negro, tapando los ojos.
      · Los ojos son calados (blancos = sin tinta) y van más grandes, porque a
        ese tamaño un ojo fino se cierra y la cara se convierte en una mancha.
      · El asa es más gruesa: una línea de 24 a esa escala desaparece.
  -->
  <g fill="#000000">
    <rect x="84" y="170" width="344" height="298" rx="28"/>
    <path d="M84 196 L90 44 C90 44 158 92 190 178 Z"/>
    <path d="M428 196 L422 44 C422 44 354 92 322 178 Z"/>
  </g>
  <path d="M198 172 C198 80 314 80 314 172" fill="none" stroke="#000000" stroke-width="34" stroke-linecap="round"/>
  <g fill="#FFFFFF" transform="translate(73,116) scale(0.70)">
    <path d="M302.713 369.764C440.213 302.264 451.713 210.828 418.713 190.764C362.713 156.716 282.713 271.264 302.713 369.764Z"/>
    <path d="M221.713 363.764C180.213 350.764 73.7125 266.264 123.213 235.264C174.788 202.964 211.213 300.764 221.713 363.764Z"/>
  </g>
</svg>
