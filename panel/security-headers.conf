# CABECERAS DE SEGURIDAD — se incluyen desde cada `location` de nginx.conf.
# =============================================================================
# Van en un archivo aparte y no en el `server` porque en nginx un `add_header`
# dentro de un `location` REEMPLAZA a los del nivel de arriba (no se suman): con
# las cabeceras a nivel `server`, los `location` que ya ponen su Cache-Control
# las perderían en silencio. Incluyéndolas en cada uno, nunca faltan.

# El navegador no adivina el tipo de un archivo: lo que el servidor dice que es JS es JS.
add_header X-Content-Type-Options "nosniff" always;

# Nadie puede meter el sistema adentro de un <iframe> de otro sitio (clickjacking).
add_header X-Frame-Options "DENY" always;

# Al salir a otro sitio (un link a WhatsApp) no se manda la ruta interna, solo el origen.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Solo se usa la CÁMARA (escáner de códigos de barras), y solo de este sitio.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

# Este sitio no comparte contexto de navegación con ventanas de otros orígenes.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Siempre por https (el navegador lo ignora si llegó por http, así que no molesta en pruebas).
add_header Strict-Transport-Security "max-age=31536000" always;

# QUÉ PUEDE CARGAR Y EJECUTAR LA PÁGINA. Es la defensa que más pesa: si alguna vez se
# colara un texto malicioso en pantalla, no puede ejecutar scripts propios ni mandar
# datos a un servidor ajeno por http.
#  - script-src 'self': solo el JavaScript de este sitio (sin scripts inline ni eval).
#  - style-src 'unsafe-inline': MUI/emotion inyecta estilos en línea; es lo único flojo.
#  - img-src data: blob: https:: logos y QR en data:, fotos subidas en blob:, fotos de https.
#  - connect-src 'self' https:: la API en el mismo dominio, o en otro con https.
#  - frame-ancestors 'none' / object-src 'none': ni dentro de otro sitio ni plugins.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
